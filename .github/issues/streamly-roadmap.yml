project: Streamly
milestone: FAANG-Grade Distributed Telemetry Platform

issues:

  - title: "Implement Reliable Event Persistence"
    number: 11
    labels:
      - persistence
      - kafka
      - backend
    body: |
      ## Overview
      Improve telemetry persistence reliability by introducing a proper processing layer between Kafka consumption and PostgreSQL storage.

      ## Objectives
      - Separate Kafka event models from database entities
      - Introduce persistence service layer
      - Implement transactional event processing
      - Add idempotent event handling

      ## Architecture

      Kafka Consumer
          |
          v
      Processing Service
          |
          v
      Persistence Layer
          |
          v
      PostgreSQL

      ## Acceptance Criteria
      - Duplicate Kafka events do not create duplicate records
      - Persistence failures are handled safely
      - Database writes are transactional


  - title: "Implement Retry and Dead Letter Queue Handling"
    number: 12
    labels:
      - kafka
      - reliability
    body: |
      ## Overview
      Introduce failure recovery mechanisms for failed telemetry processing.

      ## Objectives
      - Add retry mechanism
      - Configure retry topics
      - Implement Dead Letter Queue
      - Handle poison messages

      ## Acceptance Criteria
      - Failed events are retried
      - Permanently failed events move to DLQ
      - Consumer does not stop due to invalid messages



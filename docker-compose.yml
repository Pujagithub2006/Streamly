services:
  telemetry:
    build: .
    container_name: telemetry
    ports:
      - "8080:8080"
    networks:
      - telemetry-network

  postgres:
    image: postgres:18
    container_name: telemetry-postgres
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    networks:
      - telemetry-network

volumes:
  postgres-data:

networks:
  telemetry-network:
    driver: bridge
